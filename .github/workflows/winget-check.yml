name: winget-check

# After a release is published, install it the way winget users will: from
# the release's winget manifests, on a clean Windows machine. Run this before
# submitting the manifests to microsoft/winget-pkgs. (On this CI machine the
# workflow accepts winget's agreements itself; ATLAS never does that on a
# user's computer.)
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to check, e.g. v0.1.0
        required: true

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-2025
    steps:
      - name: Download the release's manifests
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          gh release download $env:TAG --repo $env:GITHUB_REPOSITORY --pattern winget-manifests.zip
          Expand-Archive winget-manifests.zip -DestinationPath m
          $dir = Get-ChildItem m -Recurse -Filter '*.installer.yaml' | Select-Object -First 1 | Split-Path
          "MANIFEST_DIR=$dir" >> $env:GITHUB_ENV
          Get-ChildItem $dir | ForEach-Object { "== $($_.Name)"; Get-Content $_.FullName }
      - name: Validate
        shell: pwsh
        run: |
          winget validate --manifest $env:MANIFEST_DIR --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget validate failed ($LASTEXITCODE)" }
      - name: Install from the manifests
        shell: pwsh
        run: |
          winget settings --enable LocalManifestFiles
          winget install --manifest $env:MANIFEST_DIR --accept-source-agreements --accept-package-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget install failed ($LASTEXITCODE)" }
      - name: The atlas command works
        shell: pwsh
        run: |
          $atlas = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\atlas.exe'
          if (-not (Test-Path $atlas)) { throw "winget didn't create the atlas command" }
          & $atlas -version
          & $atlas -selftest -report selftest.md
          Get-Content selftest.md -TotalCount 30
      - name: Uninstall
        shell: pwsh
        run: |
          winget uninstall --id Deepakraj1207.ATLAS --accept-source-agreements --disable-interactivity
          if ($LASTEXITCODE -ne 0) { throw "winget uninstall failed ($LASTEXITCODE)" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links\atlas.exe')) { throw "the atlas command is still there" }
